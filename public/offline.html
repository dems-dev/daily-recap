<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Daily Recap</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #737373; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
      button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>Daily Recap butuh koneksi internet untuk memuat datamu. Periksa koneksi, lalu coba lagi.<br /><small>You're offline — check your connection and try again.</small></p>
      <button type="button" onclick="location.reload()">Coba lagi / Retry</button>
    </main>
  </body>
</html>
